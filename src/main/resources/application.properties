spring.application.name=anish-crackers-backend
server.port=8080

# ---- MySQL ----
# host/port fall back to localhost:3306 only when MYSQLHOST/MYSQLPORT aren't
# set (e.g. running locally). On Railway these are always injected, so this
# never applies there. Username/password have NO default — you must set
# MYSQLUSER and MYSQLPASSWORD yourself (IntelliJ Run Config -> Environment
# variables) to your own local MySQL login when running locally.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:anish_crackers}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=balapriya2519@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- File upload ----
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=60MB


# ---- Admin auth ----
app.admin.password=anishcrackers2026
app.jwt.secret=change-this-to-a-very-long-random-secret-key-for-anish-crackers-admin
app.jwt.expiration-ms=86400000

# ---- Cloudinary (image storage) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}